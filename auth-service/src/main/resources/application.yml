server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

security:
  service:
    key: ${SERVICE_KEY}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info