name: CI

on:
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      books: ${{ steps.filter.outputs.books }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth:
              - 'pom.xml'
              - '.github/workflows/ci.yml'
              - 'auth-service/**'
            books:
              - 'pom.xml'
              - '.github/workflows/ci.yml'
              - 'books-service/**'

  auth-service:
    name: Build and test auth-service
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress -pl auth-service -am clean verify

  books-service:
    name: Build and test books-service
    needs: changes
    if: needs.changes.outputs.books == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress -pl books-service -am clean verify
